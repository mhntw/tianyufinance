# ============================================================
# 自动构建 Windows 安装包（GitHub Actions）
#
# 触发方式：
#   1. 手动：仓库 Actions 页 → 本工作流 → Run workflow
#   2. 自动：推送 v 开头的 tag（如 git tag v1.0.1 && git push --tags）
#             会自动在 GitHub Release 生成草稿并挂上安装包
#
# 产物：NSIS 安装包（x64 .exe），等价于本地 `npm run tauri build -- --bundles nsis`
# 说明：macOS 包仍在你的 Mac 本机打（本机链路已稳定），CI 只出 Windows 包。
#   以后若想顺带出 macOS 包：把下面 strategy.matrix 扩成两个平台即可。
# ============================================================
name: Windows 打包

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    name: 构建 Windows NSIS 安装包
    runs-on: windows-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v5

      - name: 安装 Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tauri/package-lock.json

      - name: 安装前端依赖（Tauri CLI）
        working-directory: tauri
        run: npm ci

      - name: 安装 Rust（stable）
        uses: dtolnay/rust-toolchain@stable

      - name: 构建并上传 Windows 安装包
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: tauri
          args: --bundles nsis
          tagName: v__VERSION__
          releaseName: 添钰财务管理系统 v__VERSION__
          releaseBody: |
            Windows 64 位安装包（NSIS）。请从下方 Assets 下载 `*-setup.exe`。
            macOS 安装包请在 Mac 本机执行 tauri build 生成。
          releaseDraft: true
          prerelease: false
