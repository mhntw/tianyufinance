# ============================================================
# 自动构建 Windows + macOS 安装包并发布 Release（GitHub Actions）
#
# 触发方式：
#   1. 手动：仓库 Actions 页 → 本工作流 → Run workflow
#           产物只进各次运行的 Artifacts（不发 Release），用于预览
#   2. 自动：推送 v 开头的 tag（如 git tag v1.0.1 && git push --tags）
#           自动创建正式 Release，Windows/macOS 安装包并行上传（无需手动 Publish）
#
# 产物：
#   Windows x64      ：NSIS `*-setup.exe`
#   macOS（M 芯片）  ：`.dmg` / `.app`（Apple Silicon arm64）
#
# 说明：
#   - macOS 包未配置 Apple 开发者证书签名，新机器首次打开请「右键 → 打开」；
#     日后如需对外正式分发再补签名/公证（证书放 CI secrets）。
#   - tag 版本号必须与 tauri/src-tauri/tauri.conf.json 的 version 一致。
# ============================================================
name: 自动打包发布

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # 仅 tag 触发时执行：先创建正式 Release 占位，供两个构建作业并行上传
  create-release:
    name: 创建正式 Release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    outputs:
      release_id: ${{ steps.create.outputs.id }}
    steps:
      - name: 拉取代码
        uses: actions/checkout@v5

      - name: 创建 Release
        id: create
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 添钰财务管理系统 ${{ github.ref_name }}
          releaseBody: |
            桌面安装包：
            - macOS（Apple Silicon / M 芯片）：`*.dmg`
            - Windows 64 位：`*-setup.exe`（NSIS）

            macOS 包未签名，若被系统拦截请右键点击 →「打开」。
          releaseDraft: false   # 自动发布为正式 Release
          prerelease: false

  # Windows 与 macOS 并行构建（手动 Run 时此作业仍执行、产物进 Artifacts）
  build:
    name: 构建 ${{ matrix.label }}
    needs: create-release
    if: ${{ !cancelled() }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            runner: windows-latest
            args: --bundles nsis
          - label: macOS Apple Silicon
            runner: macos-latest
            args: --bundles app,dmg
    steps:
      - name: 拉取代码
        uses: actions/checkout@v5

      - name: 安装 Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tauri/package-lock.json

      - name: 安装前端依赖（Tauri CLI）
        working-directory: tauri
        run: npm ci

      - name: 安装 Rust（stable）
        uses: dtolnay/rust-toolchain@stable

      - name: 构建并上传安装包
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: tauri
          args: ${{ matrix.args }}
          releaseId: ${{ needs.create-release.outputs.release_id }}
