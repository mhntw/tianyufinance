# 自动发布（推 v* 标签触发）：Windows + macOS 双平台安装包进同一 Release
#
# 流程：Windows 先跑 → 创建 Release + 写 body + 上传 .exe
#       macOS 后跑 → 附加 .dmg（不再写 body，避免覆盖）
# 版本号自动同步：tag v0.6.0 → tauri.conf.json version: "0.6.0"
name: 自动发布

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # 回归自检
  #
  # 【为什么需要】此前 CI 只有构建、不跑任何测试，导致 2 个测试长期失败而无人察觉
  # （直到 2026-09-19 才被发现）。测试写了不跑等于没写。
  #
  # 【已升级为硬门禁】build-windows 带 needs: selftest —— 测试不过就不打包发版。
  # 2026-09-20 升级前，先解决了当初「不敢设门禁」的真正原因（不是"路径差异"，
  # 而是 6 个脚本在无账套环境下必然报错）：
  #   1) 它们硬编码 macOS 路径（~/Library/Application Support/添钰财务/books），
  #      CI 跑在 Linux 上必然找不到账套。现全部改为跨平台探测（macOS/Windows/Linux）。
  #   2) 它们把「环境缺样本」当成「测试失败」（exit 1）。现改为打印「跳过」并返回 0：
  #      无账套环境跳过、有账套环境真跑 —— 两种环境都必须全绿，门禁才有意义。
  #   3) sim_*.js（模拟记账验证）一并纳入 run-all.js，同样做了无账套跳过。
  # 实测：无账套环境（模拟 CI）32/0；本机（有账套）32/0。
  selftest:
    name: 回归自检
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: 安装 Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: 运行回归自检（tools/run-all.js）
        run: node tools/run-all.js

      # run-all.js 只跑 Node 侧脚本，**不含** Rust 单测（见其文件头说明）。
      # 而 Rust 侧有一条真正会删文件的判据（rotate_backups 的环形保留）与导出文件名规则，
      # 此前只靠人记得手动跑 —— 现把它接进流水线（见 build-windows 的「Rust 单测」步骤）。
      #
      # 版本号卡口：必须带 --expect 传本次 tag。不能裸用 --check ——
      # 本工作流是由 push tag 触发的，那一刻该 tag 必然已存在，而 --check 的
      # 「tag 已存在 → 报错」是给**本地发版前**防重复打 tag 用的，裸用会让门禁永远为红。
      # --expect 下改判「四处版本号是否等于本次 tag」：这正是发版真正要防的错
      # （打了 tag 却忘了 --set → 安装包与界面「软件版本」不一致 → 更新检查永认为有新版本）。
      - name: 版本号卡口（四处一致，且等于本次 tag）
        run: node tools/version.js --check --expect ${{ github.ref_name }}

  build-windows:
    name: 构建 Windows
    needs: selftest
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: 安装 Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tauri/package-lock.json

      - name: 同步版本号到 tauri.conf.json
        run: |
          node -e "
            const fs=require('fs');
            const p='tauri/src-tauri/tauri.conf.json';
            const cfg=JSON.parse(fs.readFileSync(p,'utf8'));
            cfg.version='${{ github.ref_name }}'.replace(/^v/,'');
            fs.writeFileSync(p,JSON.stringify(cfg,null,2)+'\n');
            console.log('version set to',cfg.version);
          "

      - name: 安装前端依赖
        working-directory: tauri
        run: npm ci

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust 增量缓存
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri/src-tauri -> target

      # Rust 单测（lib）：放在**构建机上**跑，而不是 selftest 那台 ubuntu ——
      # 编译本 crate 需要 webkit2gtk 等系统依赖，ubuntu 上得额外 apt 装一堆，脆弱且更慢；
      # 这里紧跟 rust-cache，用的正是构建要用的那份缓存，增量成本很低。
      # 选立即判据是纯函数（drop_candidates / sanitize_filename / extract_book_name），与平台无关，
      # 故只在先跑的 build-windows 里跑一次，不重复消耗 macOS 机时。
      - name: Rust 单测（lib）
        working-directory: tauri/src-tauri
        run: cargo test --lib

      - name: 构建 Windows 并上传
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: tauri
          args: --bundles nsis
          tagName: ${{ github.ref_name }}
          releaseName: 添钰财务管理系统 ${{ github.ref_name }}
          releaseBody: |
            - Windows：`*-setup.exe`
            - macOS：`*.dmg`
            macOS 包未签名，首次打开请右键 →「打开」。
          releaseDraft: false
          prerelease: false

  build-macos:
    name: 构建 macOS
    needs: build-windows
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: 安装 Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tauri/package-lock.json

      - name: 同步版本号到 tauri.conf.json
        run: |
          node -e "
            const fs=require('fs');
            const p='tauri/src-tauri/tauri.conf.json';
            const cfg=JSON.parse(fs.readFileSync(p,'utf8'));
            cfg.version='${{ github.ref_name }}'.replace(/^v/,'');
            fs.writeFileSync(p,JSON.stringify(cfg,null,2)+'\n');
            console.log('version set to',cfg.version);
          "

      - name: 安装前端依赖
        working-directory: tauri
        run: npm ci

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust 增量缓存
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri/src-tauri -> target

      - name: 构建 macOS 并上传
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: tauri
          args: --bundles app,dmg
          tagName: ${{ github.ref_name }}
          releaseName: 添钰财务管理系统 ${{ github.ref_name }}
          # 不写 releaseBody：Release 已由 Windows job 创建，此处仅附加 .dmg
          releaseDraft: false
          prerelease: false
