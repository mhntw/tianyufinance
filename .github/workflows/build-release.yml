# 自动发布（推 v* 标签触发）：Windows + macOS 双平台安装包进同一 Release
#
# 流程：Windows 先跑 → 创建 Release + 写 body + 上传 .exe
#       macOS 后跑 → 附加 .dmg（不再写 body，避免覆盖）
# 版本号自动同步：tag v0.6.0 → tauri.conf.json version: "0.6.0"
name: 自动发布

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # 回归自检（2026-09-19 新增）
  #
  # 【为什么需要】此前 CI 只有构建、不跑任何测试，导致 2 个测试长期失败而无人察觉
  # （直到 2026-09-19 才被发现）。测试写了不跑等于没写，这是本项目目前投入产出比
  # 最高的一处修补：28 个脚本统一入口，全量耗时约 10 秒。
  #
  # 【为什么暂不阻塞发布】CI 运行在 Linux，而开发者本地是 macOS —— 两者在
  # 路径分隔、文件权限、大小写敏感性等方面存在差异，直接设为硬门禁有卡住发布的风险。
  # 故先以 continue-on-error 观察若干次发布：若连续稳定通过，再移除该行升级为门禁
  # （届时可加 needs: selftest 让构建依赖它）。
  selftest:
    name: 回归自检
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - name: 安装 Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: 运行回归自检（tools/run-all.js）
        run: node tools/run-all.js

  build-windows:
    name: 构建 Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: 安装 Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tauri/package-lock.json

      - name: 同步版本号到 tauri.conf.json
        run: |
          node -e "
            const fs=require('fs');
            const p='tauri/src-tauri/tauri.conf.json';
            const cfg=JSON.parse(fs.readFileSync(p,'utf8'));
            cfg.version='${{ github.ref_name }}'.replace(/^v/,'');
            fs.writeFileSync(p,JSON.stringify(cfg,null,2)+'\n');
            console.log('version set to',cfg.version);
          "

      - name: 安装前端依赖
        working-directory: tauri
        run: npm ci

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust 增量缓存
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri/src-tauri -> target

      - name: 构建 Windows 并上传
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: tauri
          args: --bundles nsis
          tagName: ${{ github.ref_name }}
          releaseName: 添钰财务管理系统 ${{ github.ref_name }}
          releaseBody: |
            - Windows：`*-setup.exe`
            - macOS：`*.dmg`
            macOS 包未签名，首次打开请右键 →「打开」。
          releaseDraft: false
          prerelease: false

  build-macos:
    name: 构建 macOS
    needs: build-windows
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: 安装 Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tauri/package-lock.json

      - name: 同步版本号到 tauri.conf.json
        run: |
          node -e "
            const fs=require('fs');
            const p='tauri/src-tauri/tauri.conf.json';
            const cfg=JSON.parse(fs.readFileSync(p,'utf8'));
            cfg.version='${{ github.ref_name }}'.replace(/^v/,'');
            fs.writeFileSync(p,JSON.stringify(cfg,null,2)+'\n');
            console.log('version set to',cfg.version);
          "

      - name: 安装前端依赖
        working-directory: tauri
        run: npm ci

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust 增量缓存
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri/src-tauri -> target

      - name: 构建 macOS 并上传
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: tauri
          args: --bundles app,dmg
          tagName: ${{ github.ref_name }}
          releaseName: 添钰财务管理系统 ${{ github.ref_name }}
          # 不写 releaseBody：Release 已由 Windows job 创建，此处仅附加 .dmg
          releaseDraft: false
          prerelease: false
