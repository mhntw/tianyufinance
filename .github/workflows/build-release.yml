# ============================================================
# 自动发布（推 v* 标签触发）：Windows + macOS 双平台安装包
#
# 流程：先创建正式 Release → Windows/macOS 并行构建并上传到该 Release。
# 上传双保险：build job 同时传 releaseId 与 tagName，
#   - releaseId 来自 create job（正常路径）
#   - 即使 releaseId 未传成功，tagName 也会让 tauri-action 定位到已创建的 Release 再附加
#
# 手动预览请用另一个工作流「构建预览包（手动）」——它只出 Artifacts，不进 Release。
# ============================================================
name: 自动发布

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  create-release:
    name: 创建正式 Release
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.release_id }}
    steps:
      - name: 拉取代码
        uses: actions/checkout@v5

      - name: 创建正式 Release（已存在则复用）
        id: create
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "添钰财务管理系统 $TAG" \
              --notes "桌面安装包：macOS（Apple Silicon）\`*.dmg\`、Windows 64 位 \`*-setup.exe\`（NSIS）。macOS 包未签名，若被系统拦截请右键点击 →「打开」。" \
              --verify-tag
          fi
          ID="$(gh release view "$TAG" --json id --jq .id)"
          echo "release_id=$ID" | tee -a "$GITHUB_OUTPUT"

  build:
    name: 构建 ${{ matrix.label }}
    needs: create-release
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            runner: windows-latest
            args: --bundles nsis
          - label: macOS Apple Silicon
            runner: macos-latest
            args: --bundles app,dmg
    steps:
      - name: 拉取代码
        uses: actions/checkout@v5

      - name: 安装 Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tauri/package-lock.json

      - name: 安装前端依赖（Tauri CLI）
        working-directory: tauri
        run: npm ci

      - name: 安装 Rust（stable）
        uses: dtolnay/rust-toolchain@stable

      - name: Rust 增量缓存（第二次构建起显著提速）
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri/src-tauri -> target

      - name: 构建并上传安装包到 Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: tauri
          args: ${{ matrix.args }}
          releaseId: ${{ needs.create-release.outputs.release_id }}
          tagName: ${{ github.ref_name }}
